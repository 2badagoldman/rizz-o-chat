name: Mobile builds (AAB + IPA)

# Produces the store binaries from the Capacitor shell.
# Android runs unattended once the keystore secrets are set.
# iOS requires an Apple Developer account + signing assets (macOS runner).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  android:
    name: Android App Bundle (.aab)
    runs-on: ubuntu-latest
    env:
      # Must match the app created in Google Play Console (com.crushchat.app).
      CAP_APP_ID: com.crushchat.app
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Add Android platform
        run: |
          bunx cap add android || true
          bunx cap sync android

      - name: Align applicationId with Play Console
        run: |
          sed -i "s/applicationId \".*\"/applicationId \"$CAP_APP_ID\"/" android/app/build.gradle
          grep applicationId android/app/build.gradle

      - name: Prepare upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            # First run: generate an upload key. Google Play App Signing holds the
            # real signing key, so this upload key just needs to stay consistent.
            # Save the 'crush-upload-keystore' artifact into the repo secrets
            # (ANDROID_KEYSTORE_BASE64 etc.) after this run so future releases
            # reuse the same key.
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias crush-upload -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass crush-upload-2026 -keypass crush-upload-2026 \
              -dname "CN=KOLO TECHNOLOGY LLC, OU=Mobile, O=KOLO TECHNOLOGY LLC, L=Garland, ST=TX, C=US"
            echo "STORE_PASSWORD=crush-upload-2026" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=crush-upload" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=crush-upload-2026" >> "$GITHUB_ENV"
            echo "GENERATED_KEYSTORE=true" >> "$GITHUB_ENV"
          fi

      - name: Build signed bundle
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_CRUSH_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_CRUSH_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_CRUSH_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_CRUSH_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: crush-android-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Save upload keystore (first run only — store as secrets, then delete artifact)
        if: ${{ env.GENERATED_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: crush-upload-keystore
          path: android/app/release.keystore
          retention-days: 7

  ios:
    name: iOS App Store package (.ipa)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Add iOS platform
        run: |
          bunx cap add ios || true
          bunx cap sync ios

      - name: Install signing assets
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$CERT_P12_BASE64" | base64 -d > /tmp/cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/crush.mobileprovision

      - name: Archive and export
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
          </dict></plist>
          PLIST
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath /tmp/App.xcarchive archive
          xcodebuild -exportArchive -archivePath /tmp/App.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist -exportPath /tmp/export

      - uses: actions/upload-artifact@v4
        with:
          name: crush-ios-ipa
          path: /tmp/export/*.ipa
